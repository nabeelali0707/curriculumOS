services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: curriculumos
      POSTGRES_PASSWORD: curriculumos
      POSTGRES_DB: curriculumos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculumos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
