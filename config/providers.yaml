# Provider routing config. No secrets here — keys come from environment
# variables (see .env.example). Every entry maps to a concrete class in
# app/providers/<capability>/.
#
# LLM generation and verification are each a fallback chain (see
# app/providers/router.py:FallbackChain): the first entry is primary, the
# rest are tried in order if it fails. verification's chain MUST NOT put
# generation's provider first (04_PROVIDER_STRATEGY.md: this is the
# product's trust mechanism, not a nicety — a verifier grading its own
# generation is not a check) — app/providers/llm/__init__.py checks this
# at call time and also excludes whichever provider actually generated
# the claim being verified, not just config-time priority[0].
#
# A provider only actually gets used if its API key is set in the
# environment — unconfigured providers are skipped, not treated as
# failures. ollama is listed last in both chains as a fully-local,
# no-API-key option (mainly useful for dev / offline work), not because
# it's the intended production last resort.

llm:
  generation:
    # Chain per 04_PROVIDER_STRATEGY.md: Anthropic -> OpenAI -> self-hosted
    # open-weight (the spec names Together/Fireworks/Groq as alternative
    # hosts for that tier, not a strict sub-order — groq/together/fireworks
    # order below is a reasonable default, not a spec requirement).
    priority: [anthropic, openai, groq, together, fireworks, openrouter, ollama]
    retry:
      attempts: 3
      backoff_seconds: 2
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60
  verification:
    # First entry must differ from generation.priority[0].
    priority: [openai, anthropic, groq, openrouter]
    retry:
      attempts: 3
      backoff_seconds: 2
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60

embeddings:
  # Embedding models are not interchangeable mid-request: swapping providers
  # means rebuilding the index, not per-call failover. One provider for P0.
  primary: qwen3-embedding-8b

parsing:
  # Routed by document type/confidence, not a fixed priority list.
  born_digital_pdf: docling
  scanned_or_multicolumn: marker
  low_confidence_fallback: null  # unset until a managed OCR provider is wired

solver:
  # No live failover — a solver swap is an engineering decision, not a
  # runtime fallback. Time-boxing degrades to a greedy heuristic.
  engine: ortools-cp-sat
  time_limit_seconds: 30  # provisional; 09_RISKS_AND_OPEN_QUESTIONS.md flags
                           # this as something to set from real usage data,
                           # not an arbitrary default. Revisit after pilot.
