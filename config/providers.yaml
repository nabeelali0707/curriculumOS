# Provider routing config. No secrets here — keys come from environment
# variables (see .env.example). Every entry maps to a concrete class in
# app/providers/<capability>/.
#
# LLM generation and verification are each a fallback chain (see
# app/providers/router.py:FallbackChain): the first entry is primary, the
# rest are tried in order if it fails. verification's chain MUST NOT put
# generation's provider first (04_PROVIDER_STRATEGY.md: this is the
# product's trust mechanism, not a nicety — a verifier grading its own
# generation is not a check) — app/providers/llm/__init__.py checks this
# at call time and also excludes whichever provider actually generated
# the claim being verified, not just config-time priority[0].
#
# A provider only actually gets used if its API key is set in the
# environment — unconfigured providers are skipped, not treated as
# failures. ollama is listed last in both chains as a fully-local,
# no-API-key option (mainly useful for dev / offline work), not because
# it's the intended production last resort.

llm:
  generation:
    # LIVE-DEMO OVERRIDE: ollama first, not last. 04_PROVIDER_STRATEGY.md's
    # documented order is Anthropic -> OpenAI -> self-hosted; as of this
    # run neither Anthropic/OpenAI keys are set nor do the configured
    # Groq/OpenRouter keys actually work (invalid key / no credits — see
    # session notes), so ollama is the only provider that's actually
    # reachable. Revert this ordering once real cloud keys are in place.
    priority: [ollama, anthropic, openai, groq, together, fireworks, openrouter]
    retry:
      attempts: 3
      backoff_seconds: 2
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60
  verification:
    # ollama_verify is the SAME Ollama instance as generation's "ollama"
    # entry but a different model (see app/config.py's ollama_verify_model
    # / app/providers/llm/ollama_provider.py) — a distinct provider name so
    # the "verification must not start with generation's provider" check
    # in this package's __init__.py treats it as real independent
    # verification, not a model grading its own output. First entry must
    # differ from generation.priority[0].
    priority: [ollama_verify, openai, anthropic, groq, openrouter]
    retry:
      attempts: 3
      backoff_seconds: 2
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 60

embeddings:
  # Embedding models are not interchangeable mid-request: swapping providers
  # means rebuilding the index, not per-call failover. One provider for P0.
  # Served locally via Ollama (`ollama pull qwen3-embedding:0.6b`), using
  # Ollama's OpenAI-compatible /v1/embeddings route — no separate inference
  # server to stand up for the pilot.
  primary: qwen3-embedding:0.6b

parsing:
  # Ordered fallback, not type-routed dispatch: a caller can't reliably tell
  # a born-digital PDF from a scanned one before parsing it, so the chain
  # finds out by trying. Each provider raises rather than returning an empty
  # document, which is what lets the next one take over.
  #
  #   pypdf_text     PDFs with a text layer. First because it's the ONLY
  #                  parser that reports real page numbers, and page-exact
  #                  provenance is the product's core requirement.
  #   anydoc         Office formats (docx/pptx/xlsx/odt/rtf/epub/csv) and
  #                  PDFs pypdf couldn't read. Rust, no ML models, better
  #                  structure — but emits no page boundaries.
  #   vision_llm_ocr Scanned pages with no text layer at all. Slow and
  #                  token-costing, so it's genuinely last.
  #
  # docling is available via get_docling_router() but stays out of this
  # chain: its layout model downloads on first use, and an upload should
  # never trigger that.
  priority: [pypdf_text, anydoc, vision_llm_ocr]

solver:
  # No live failover — a solver swap is an engineering decision, not a
  # runtime fallback. Time-boxing degrades to a greedy heuristic.
  engine: ortools-cp-sat
  time_limit_seconds: 30  # provisional; 09_RISKS_AND_OPEN_QUESTIONS.md flags
                           # this as something to set from real usage data,
                           # not an arbitrary default. Revisit after pilot.
